<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f6a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Кувшины</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fbf7f2;color:#2a2a2a;padding-bottom:150px}
header{background:#2f6f6a;color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.mon button{background:#ffffff30;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:18px}
.card{background:#fff;border-radius:14px;margin:12px;padding:14px;box-shadow:0 1px 4px #0001}
.big{font-size:34px;font-weight:700}.lbl{color:#777;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.neg{color:#c0392b}.pos{color:#2f6f6a}.two{display:flex;gap:10px}.two>div{flex:1}
.bar{height:6px;background:#eee;border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#2f6f6a}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:12px;color:#666}nav button.on{color:#2f6f6a;font-weight:700}
.add{position:fixed;bottom:62px;left:0;right:0;display:flex;gap:8px;padding:8px 12px;background:#fbf7f2ee}
.add input{flex:1;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}.add button{border:0;border-radius:12px;padding:0 16px;font-size:20px;background:#2f6f6a;color:#fff}
.mic.rec{background:#c0392b}
input,select{font-size:16px;padding:9px;border:1px solid #ccc;border-radius:10px;width:100%}
.btn{background:#2f6f6a;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:16px}.btn.g{background:#eee;color:#333}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}.modal>div{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.seg{display:flex;gap:6px}.seg button{flex:1}.small{font-size:12px;color:#888}.pct{width:70px;text-align:right}
.tl{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:#2e9e5b}.tl.o{background:#e69100}.tl.r{background:#c0392b}.pl{width:100px;text-align:right}
.x{background:none;border:0;color:#c0392b;font-size:18px}
</style></head><body>
<header><h1>Кувшины</h1><div class="mon"><button onclick="mv(-1)">‹</button><b id="mname"></b><button onclick="mv(1)">›</button></div></header>
<main id="v"></main>
<div class="add"><button class="mic" id="mic" onclick="voice()">🎤</button><input id="q" placeholder="пришла зарплата 40000 / подарок 1500" onkeydown="if(event.key=='Enter')parse(this.value)"><button onclick="parse(q.value)">➤</button></div>
<nav id="nav"></nav><div id="m"></div>
<script>
const $=s=>document.querySelector(s);
const DEF={jars:[
{id:'must',name:'Обязательные платежи',pct:40,kw:['обязат','платеж','налог','коммунал','жкх','кредит','ипотек','связь','интернет']},
{id:'kids',name:'Дети',pct:15,kw:['дет','ребен','ребён','сын','дочь','школ','сад','кружок']},
{id:'learn',name:'Обучение',pct:10,kw:['обуч','курс','книг','учеб','вебинар']},
{id:'rest',name:'Отдых',pct:10,kw:['отдых','отпуск','кино','кафе','ресторан','поездк','путешеств']},
{id:'misc',name:'Разное',pct:10,kw:['разное','продукт','магазин','одежд','такси']},
{id:'piggy',name:'Копилка',pct:10,kw:['копилк','накоплен','отложи']},
{id:'gift',name:'Подарки',pct:5,kw:['подар','цвет','днюх','рожден']}],
plans:{},sources:[{id:'s1',name:'Зарплата',planned:0},{id:'s2',name:'Фриланс',planned:0}],tx:[]};
let S=JSON.parse(localStorage.getItem('jars')||'null')||DEF;if(!S.plans)S.plans={};
const save=()=>localStorage.setItem('jars',JSON.stringify(S));
let tab='home',mo=new Date();mo.setDate(1);
const ym=d=>d.slice(0,7),cur=()=>mo.getFullYear()+'-'+String(mo.getMonth()+1).padStart(2,'0');
const f=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jar=id=>S.jars.find(j=>j.id==id)||{name:'?'};
function mv(d){mo.setMonth(mo.getMonth()+d);render()}
function stats(){const m=cur(),r={};S.jars.forEach(j=>r[j.id]={bal:0,pin:0,out:0,planIn:0});
 S.tx.forEach(t=>{if(t.type=='in'){for(const k in t.alloc){if(!r[k])continue;r[k].bal+=t.alloc[k];if(ym(t.date)==m)r[k].pin+=t.alloc[k]}}
 else if(r[t.jar]){r[t.jar].bal-=t.amount;if(ym(t.date)==m)r[t.jar].out+=t.amount}});
 const pl=S.sources.reduce((a,s)=>a+(+s.planned||0),0);S.jars.forEach(j=>r[j.id].plan=planFor(j.id));
 r.plannedIncome=pl;return r}
function planFor(id){const ks=Object.keys(S.plans).filter(k=>k<=cur()&&S.plans[k][id]!=null).sort();return ks.length?+S.plans[ks[ks.length-1]][id]:0}
function setPlan(id,v){(S.plans[cur()]=S.plans[cur()]||{})[id]=+v||0;save();render()}
function light(x){const lim=x.pin,u=lim>0?x.out/lim:(x.out>0?9:0),c=u>1?'r':u>=0.8?'o':'';return {u,c,t:lim>0?Math.round(u*100)+'%':(x.out>0?'нет дохода':'0%')}}
function render(){$('#mname').textContent=mo.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 $('#nav').innerHTML=[['home','🏠','Главная'],['pf','📊','План/факт'],['ops','🧾','Операции'],['set','⚙️','Настройки']].map(([k,i,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${i}<br>${t}</button>`).join('');
 $('#v').innerHTML=({home,pf,ops,set})[tab]()}
function home(){const s=stats();let av=0,sv=0;S.jars.forEach(j=>j.id=='piggy'?sv+=s[j.id].bal:av+=s[j.id].bal);
 const inc=S.tx.filter(t=>t.type=='in'&&ym(t.date)==cur()).reduce((a,t)=>a+t.amount,0);
 return `<div class="card"><div class="lbl">Доступно к трате</div><div class="big ${av<0?'neg':'pos'}">${f(av)}</div>
 <div class="two" style="margin-top:10px"><div><div class="lbl">В накоплениях (копилка)</div><b>${f(sv)}</b></div><div><div class="lbl">Доход за месяц</div><b>${f(inc)}</b></div></div></div>
 <div class="card"><b>Кувшины</b>${S.jars.map(j=>{const x=s[j.id],tot=x.bal+x.out;return `<div class="row" onclick="openJar('${j.id}')"><div style="flex:1">${esc(j.name)} <span class="small">${j.pct}%</span> <span class="tl ${light(x).c}">${light(x).t} лимита</span><div class="bar"><i style="width:${tot>0?Math.max(0,Math.min(100,x.bal/tot*100)):0}%"></i></div></div><b class="${x.bal<0?'neg':''}">${f(x.bal)}</b></div>`}).join('')}</div>
 <div class="small" style="margin:0 14px">Остатки переносятся на следующий месяц. Нажми на кувшин — увидишь операции.</div>`}
function pf(){const s=stats();let t={p:0,a:0,o:0};
 const rows=S.jars.map(j=>{const x=s[j.id],l=light(x);t.p+=x.plan;t.a+=x.pin;t.o+=x.out;const bal=x.plan-x.out;return `<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:140px"><b>${esc(j.name)}</b> <span class="tl ${l.c}">${l.t} лимита</span><div class="small">лимит по % (${j.pct}%): ${f(x.pin)}</div><div class="bar"><i style="width:${Math.min(100,l.u*100)}%;${l.c=='r'?'background:#c0392b':l.c=='o'?'background:#e69100':''}"></i></div></div>
 <div style="text-align:right"><div class="small">план, ₽</div><input class="pl" type="number" inputmode="decimal" value="${x.plan||''}" placeholder="0" onchange="setPlan('${j.id}',this.value)"></div>
 <div style="text-align:right;min-width:78px"><div class="small">факт</div><b>${f(x.out)}</b></div>
 <div style="text-align:right;min-width:78px"><div class="small">баланс</div>${x.plan?`<b class="${bal<0?'neg':'pos'}">${f(bal)}</b>`:'<b class="small">нет плана</b>'}</div></div>`}).join('');
 const bySrc=S.sources.map(src=>{const a=S.tx.filter(t=>t.type=='in'&&t.source==src.id&&ym(t.date)==cur()).reduce((q,t)=>q+t.amount,0);return `<div class="row"><span>${esc(src.name)}</span><span class="small">план ${f(src.planned||0)}</span><b>${f(a)}</b></div>`}).join('');
 const tb=t.p-t.o;
 return `<div class="card"><b>Доходы: план и факт</b>${bySrc}<div class="row"><b>Итого</b><span class="small">план ${f(s.plannedIncome)}</span><b>${f(t.a)}</b></div></div><div class="card"><b>Расходы: план, факт, баланс</b>${rows}<div class="row"><b>Итого</b><span class="small">план ${f(t.p)}</span><span>факт <b>${f(t.o)}</b></span><b class="${tb<0?'neg':'pos'}">${f(tb)}</b></div></div>
 <div class="small" style="margin:0 14px">План расходов вводишь сама в рублях, он копируется на следующие месяцы. Светофор: лимит категории = процент от дохода, реально поступившего за месяц. До 80% зелёный, 80–100% оранжевый, выше 100% красный.</div>`}
function opRow(t){const sg=t.type=='in'?'+':'−';return `<div class="row"><div style="flex:1"><b class="${t.type=='in'?'pos':''}">${sg}${f(t.amount)}</b> ${t.type=='in'?esc((S.sources.find(x=>x.id==t.source)||{}).name||''):esc(jar(t.jar).name)}<div class="small">${t.date} ${esc(t.note)}</div></div><button class="x" onclick="del('${t.id}')">✕</button></div>`}
function ops(){const l=S.tx.filter(t=>ym(t.date)==cur()).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));return `<div class="card">${l.map(opRow).join('')||'<div class="lbl">Операций за месяц нет. Напиши или скажи внизу.</div>'}</div>`}
function openJar(id){const l=S.tx.filter(t=>t.type=='out'&&t.jar==id).sort((a,b)=>b.date.localeCompare(a.date));$('#m').innerHTML=`<div class="modal" onclick="if(event.target==this)m.innerHTML=''"><div><b>${esc(jar(id).name)}</b>${l.map(opRow).join('')||'<div class="lbl">Расходов пока нет</div>'}<button class="btn g" onclick="m.innerHTML=''">Закрыть</button></div></div>`}
function del(id){if(!confirm('Удалить операцию?'))return;S.tx=S.tx.filter(t=>t.id!=id);save();m.innerHTML='';render()}
function set(){const sum=S.jars.reduce((a,j)=>a+(+j.pct||0),0);
 return `<div class="card"><b>Проценты по кувшинам</b><div class="small">Сумма: <b class="${sum==100?'pos':'neg'}">${sum}%</b> ${sum==100?'':'— должно быть 100'}. Меняются только для новых поступлений.</div>
 ${S.jars.map(j=>`<div class="row"><span>${esc(j.name)}</span><span><input class="pct" type="number" min="0" max="100" value="${j.pct}" onchange="setp('${j.id}',this.value)"> %</span></div>`).join('')}</div>
 <div class="card"><b>Источники дохода</b><div class="small">В поле справа — плановый доход в месяц (для «План»).</div>
 ${S.sources.map(s=>`<div class="row"><input value="${esc(s.name)}" onchange="srcn('${s.id}',this.value)"><input class="pct" style="width:100px" type="number" value="${s.planned||0}" onchange="srcp('${s.id}',this.value)"><button class="x" onclick="srcd('${s.id}')">✕</button></div>`).join('')}
 <button class="btn g" onclick="srca()">+ Источник</button></div>
 <div class="card"><b>Данные</b><div class="small">Хранятся только в телефоне. Сделай копию — на случай очистки браузера.</div><div class="two"><button class="btn g" onclick="exp()">Сохранить копию</button><button class="btn g" onclick="imp.click()">Загрузить</button></div><input id="imp" type="file" hidden onchange="impf(this.files[0])"></div>`}
function setp(id,v){S.jars.find(j=>j.id==id).pct=+v||0;save();render()}
function srcn(id,v){S.sources.find(s=>s.id==id).name=v;save()}
function srcp(id,v){S.sources.find(s=>s.id==id).planned=+v||0;save();render()}
function srcd(id){if(S.sources.length<2||!confirm('Удалить источник? Прошлые операции останутся.'))return;S.sources=S.sources.filter(s=>s.id!=id);save();render()}
function srca(){const n=prompt('Название источника');if(n){S.sources.push({id:'s'+Date.now(),name:n,planned:0});save();render()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kuvshiny-backup.json';a.click()}
function impf(fl){if(!fl)return;fl.text().then(t=>{try{const d=JSON.parse(t);if(d.jars&&d.tx){S=d;save();render()}}catch(e){alert('Файл не подходит')}})}
// ввод
function num(t){t=t.toLowerCase().replace(/(\d)[\s ](?=\d{3}\b)/g,'$1').replace(',','.');let m=t.match(/(\d+(?:\.\d+)?)\s*(тыс|к\b|k\b)?/);if(!m)return 0;let n=parseFloat(m[1]);if(m[2])n*=1000;return Math.round(n*100)/100}
function parse(text){text=(text||'').trim();if(!text)return;const l=text.toLowerCase(),amount=num(l);
 const isIn=/(пришл|получил|поступил|зарплат|аванс|доход|заработал|перевели|выплат)/.test(l);
 let src=S.sources.find(s=>l.includes(s.name.toLowerCase().slice(0,5)))||S.sources[0];
 let jr=S.jars.find(j=>j.kw&&j.kw.some(k=>l.includes(k)))||S.jars.find(j=>l.includes(j.name.toLowerCase().slice(0,5)))||S.jars.find(j=>j.id=='misc')||S.jars[0];
 let note=text.replace(/\d[\d\s.,]*(тыс[а-яё]*|₽|руб[а-яё]*|р(?![а-яё]))?/gi,'').trim();
 form({type:isIn?'in':'out',amount,source:src.id,jar:jr.id,note,date:new Date().toISOString().slice(0,10)})}
function form(t){$('#m').innerHTML=`<div class="modal"><div><b>Проверь и сохрани</b>
 <div class="seg"><button class="btn ${t.type=='out'?'':'g'}" onclick="T.type='out';form(T)">Расход</button><button class="btn ${t.type=='in'?'':'g'}" onclick="T.type='in';form(T)">Доход</button></div>
 <input id="fa" type="number" inputmode="decimal" placeholder="Сумма" value="${t.amount||''}" oninput="T.amount=+this.value">
 ${t.type=='in'?`<select onchange="T.source=this.value">${S.sources.map(s=>`<option value="${s.id}" ${s.id==t.source?'selected':''}>${esc(s.name)}</option>`).join('')}</select><div class="small">Сумма будет разделена по кувшинам по процентам.</div>`
 :`<select onchange="T.jar=this.value">${S.jars.map(j=>`<option value="${j.id}" ${j.id==t.jar?'selected':''}>${esc(j.name)}</option>`).join('')}</select>`}
 <input type="date" value="${t.date}" onchange="T.date=this.value"><input placeholder="Комментарий" value="${esc(t.note)}" oninput="T.note=this.value">
 <div class="two"><button class="btn g" onclick="m.innerHTML=''">Отмена</button><button class="btn" onclick="commit()">Сохранить</button></div></div></div>`;window.T=t}
function commit(){const t=T;if(!(t.amount>0)){alert('Укажи сумму');return}
 const sum=S.jars.reduce((a,j)=>a+j.pct,0)||1;
 if(t.type=='in'){t.alloc={};let rest=t.amount;S.jars.forEach((j,i)=>{const v=i==S.jars.length-1?rest:Math.round(t.amount*j.pct/sum*100)/100;t.alloc[j.id]=v;rest=Math.round((rest-v)*100)/100})}
 t.id=Date.now()+'';S.tx.push(t);save();m.innerHTML='';q.value='';tab='home';mo=new Date(t.date);mo.setDate(1);render()}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Голосовой ввод не поддерживается. Нажми на поле и используй 🎤 на клавиатуре.');return}
 const r=new R();r.lang='ru-RU';$('#mic').classList.add('rec');r.onresult=e=>{q.value=e.results[0][0].transcript;parse(q.value)};r.onend=()=>$('#mic').classList.remove('rec');r.onerror=()=>$('#mic').classList.remove('rec');r.start()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
